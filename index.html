<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #0a0a0a;
    --bg-panel: #0f0f0f;
    --bg-card: #141414;
    --bg-hover: #1a1a1a;
    --border: #222;
    --border-bright: #333;
    --text: #e8e8e8;
    --text-dim: #999;
    --text-muted: #666;
    --green: #00e676;
    --green-bg: rgba(0, 230, 118, 0.12);
    --green-border: rgba(0, 230, 118, 0.35);
    --red: #ff1744;
    --red-bg: rgba(255, 23, 68, 0.12);
    --red-border: rgba(255, 23, 68, 0.35);
    --amber: #ffc400;
    --amber-bg: rgba(255, 196, 0, 0.12);
    --amber-border: rgba(255, 196, 0, 0.35);
    --cyan: #00e5ff;
    --cyan-bg: rgba(0, 229, 255, 0.1);
    --blue: #448aff;
    --white: #fff;
  }


  /* ---------- style switch button ---------- */
  .theme-btn { font: inherit; font-size: 11px; letter-spacing: .6px; padding: 5px 10px; cursor: pointer; color: var(--text); background: transparent; border: 1px solid var(--border-bright); border-radius: 4px; transition: .2s; white-space: nowrap; }
  .theme-btn:hover { border-color: var(--green); color: var(--green); }

  /* ---------- CLI theme: monospace, boxed, flat, colourful on grey ---------- */
  html[data-theme="cli"] {
    --bg:#cfd0d2; --bg-panel:#d7d8da; --bg-card:#d3d4d6; --bg-hover:#c3c4c8;
    --border:#4a5066; --border-bright:#2f3446;
    --text:#1d2230; --text-dim:#3d4458; --text-muted:#59607a;
    --green:#0b8f3d; --green-bg:rgba(11,143,61,.14); --green-border:rgba(11,143,61,.55);
    --red:#c8102e; --red-bg:rgba(200,16,46,.12); --red-border:rgba(200,16,46,.5);
    --amber:#b8750a; --amber-bg:rgba(184,117,10,.14); --amber-border:rgba(184,117,10,.55);
    --cyan:#00778b; --cyan-bg:rgba(0,119,139,.12); --blue:#2a5fd6; --white:#10131c;
  }
  html[data-theme="cli"] *, html[data-theme="cli"] *::before, html[data-theme="cli"] *::after { border-radius: 0 !important; box-shadow: none !important; text-shadow: none !important; }
  html[data-theme="cli"] body { font-family: ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace; background: var(--bg); }
  html[data-theme="cli"] .header-glow::before, html[data-theme="cli"] .header-glow::after { display: none; }
  html[data-theme="cli"] .header-topline { background: linear-gradient(90deg, var(--green), var(--cyan), var(--amber)); animation: none; opacity: 1; }
  html[data-theme="cli"] .pairs-strip { background: var(--bg-hover); }
  html[data-theme="cli"] .tabs-row { background: transparent; }
  html[data-theme="cli"] .tab:hover { background: rgba(0,0,0,.06); color: var(--white); }
  html[data-theme="cli"] .tab[data-soon], html[data-theme="cli"] .tab[data-soon]:hover { background: repeating-linear-gradient(135deg, transparent 0 6px, rgba(60,66,90,.22) 6px 7px); color: var(--text-muted); opacity: .6; }
  html[data-theme="cli"] .tab.active { background: rgba(11,143,61,.12); color: var(--green); }
  html[data-theme="cli"] .contact-btn { color: var(--green); background: rgba(11,143,61,.1); border-color: var(--green-border); }
  html[data-theme="cli"] .contact-btn:hover { background: rgba(11,143,61,.2); }
  html[data-theme="cli"] .status, html[data-theme="cli"] .status-dot { color: var(--text); }
  html[data-theme="cli"] .status-dot { background: var(--green); }
  html[data-theme="cli"] .tab-ind { background: var(--green); filter: none; }
  html[data-theme="cli"] .logo-text { background: none; -webkit-text-fill-color: #6b4a0a; color: #6b4a0a; animation: none; }
  html[data-theme="cli"] .brand-since { color: #6b4a0a; opacity: 1; }
